spring.application.name=backend
server.port=8080

# the running app uses the least-privilege user
spring.datasource.url=jdbc:mysql://localhost:3306/teddy_and_gift_heaven
spring.datasource.username=tagh_app
spring.datasource.password=${DB_PASSWORD:}

# Flyway uses the migration user to create the database (if missing), tables, triggers and procedures
spring.flyway.enabled=true
spring.flyway.url=jdbc:mysql://localhost:3306/teddy_and_gift_heaven?createDatabaseIfNotExist=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=tagh_migrate
spring.flyway.password=${DB_MIGRATE_PASSWORD:}

# the SQL migrations are the source of truth for tables
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:}

spring.datasource.password=Tagh_App_2026
spring.flyway.password=Tagh_Migrate_2026

# page 13: "Back up now" runs this script (path is relative to the backend folder)
app.backup.script=${BACKUP_SCRIPT:../database/backup/backup.sh}
