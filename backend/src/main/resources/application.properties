spring.application.name=backend
server.port=8080

# the running app uses the least-privilege user
spring.datasource.url=jdbc:mysql://localhost:3306/teddy_and_gift_heaven
spring.datasource.username=tagh_app
spring.datasource.password=${DB_PASSWORD:}

# Flyway creates tables, triggers and procedures with the migration user
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=tagh_migrate
spring.flyway.password=${DB_MIGRATE_PASSWORD:}

# the SQL migrations are the source of truth for tables
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
