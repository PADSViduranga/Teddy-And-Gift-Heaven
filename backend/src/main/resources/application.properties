spring.application.name=backend
server.port=8080

# the running application uses the least-privilege user
spring.datasource.url=jdbc:mysql://localhost:3306/teddy_and_gift_heaven
spring.datasource.username=tagh_app
spring.datasource.password=${DB_PASSWORD:}

# Flyway uses the migration user to create tables, triggers and procedures
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.user=tagh_migrate
spring.flyway.password=${DB_MIGRATE_PASSWORD:}

# the SQL scripts are the source of truth for the tables
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.datasource.password=Tagh_App_2026
spring.flyway.password=Tagh_Migrate_2026